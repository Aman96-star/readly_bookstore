# ============================================================================
# application-test.properties — Test configuration for Readly backend
# ============================================================================
# This configuration is used when running unit and integration tests.
# Uses H2 in-memory database to avoid polluting the development database.
# ============================================================================

# ---- Server ----
server.port=8080

# ---- App identity ----
spring.application.name=readly-backend

# ---- H2 In-Memory Database (for testing) ----
# H2 is a lightweight in-memory database perfect for testing.
# Data is lost when tests complete — perfect isolation.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for debugging (optional)
spring.h2.console.enabled=false

# ---- JPA / Hibernate ----
# create-drop: creates schema for each test and drops it after
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT (JSON Web Token) settings ----
jwt.secret=TestSecretKeyForTestingPurposesOnly32CharactersLong1234
jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000

# ---- File uploads ----
app.upload.dir=test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.root=WARN
logging.level.com.readly=DEBUG
logging.level.org.springframework.security=DEBUG
