# ============================================================================
# application-dev.properties — Development configuration for Readly backend
# ============================================================================
# This configuration is used during local development.
# Uses MySQL database with verbose logging for debugging.
# ============================================================================

# ---- Server ----
server.port=8080

# ---- App identity ----
spring.application.name=readly-backend

# ---- MySQL Database Connection ----
spring.datasource.url=jdbc:mysql://localhost:3306/readly_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update: creates/updates tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---- JWT (JSON Web Token) settings ----
jwt.secret=ReadlyBookstoreSuperSecretSigningKeyChangeThisInProduction2026
jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000

# ---- File uploads ----
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.root=WARN
logging.level.com.readly=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
