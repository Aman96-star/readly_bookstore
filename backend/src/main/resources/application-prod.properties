# ============================================================================
# application-prod.properties — Production configuration for Readly backend
# ============================================================================
# This configuration is used in production environments.
# Uses MySQL with pooling, minimal logging, and stricter settings.
# IMPORTANT: Override these values with environment variables in production!
# ============================================================================

# ---- Server ----
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---- App identity ----
spring.application.name=readly-backend

# ---- MySQL Database Connection with Connection Pooling ----
# In production, use environment variables for sensitive credentials:
#   export DB_URL=jdbc:mysql://prod-db-host:3306/readly_db
#   export DB_USER=prod_user
#   export DB_PASSWORD=prod_password
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/readly_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ---- JPA / Hibernate ----
# ddl-auto=validate: only validates schema, doesn't modify it.
# Use Flyway or Liquibase for production migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---- JWT (JSON Web Token) settings ----
# CRITICAL: Change jwt.secret to a strong random value!
# Use: openssl rand -base64 32
# Override via environment variable: export JWT_SECRET=your_secret
jwt.secret=${JWT_SECRET:ChangeThisToAStrongRandomValueInProduction12345}
jwt.expiration-ms=86400000

# ---- CORS ----
# Update this to your actual production frontend domain
app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# ---- File uploads ----
app.upload.dir=${UPLOAD_DIR:/var/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.root=WARN
logging.level.com.readly=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/readly-backend.log
logging.file.max-size=10MB
logging.file.max-history=10
