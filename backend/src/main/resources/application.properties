# ============================================================================
# application.properties — Default/Base configuration for Readly backend
# ============================================================================
# This file contains ONLY common settings shared across all profiles.
# Environment-specific settings are in separate files:
#   - application-dev.properties   (for local development)
#   - application-prod.properties  (for production)
#   - application-test.properties  (for testing)
#
# To use a specific profile, set the environment variable:
#   export SPRING_PROFILES_ACTIVE=dev    # or: prod, test
#
# Or pass it as a JVM argument:
#   java -jar app.jar --spring.profiles.active=prod
# ============================================================================

# Default to development profile if none specified
spring.profiles.active=dev

# ---- App identity (shared) ----
spring.application.name=readly-backend
spring.jpa.open-in-view=false


# ---- Swagger / OpenAPI UI ----
# Visit http://localhost:8080/swagger-ui.html once the app is running
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Logging ----
logging.level.com.readly.backend=DEBUG
logging.level.org.springframework.security=INFO
