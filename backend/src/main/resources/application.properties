# ============================================================================
# application.properties — Central configuration for the Readly backend
# ============================================================================
# Beginner note: this is like your .env file in Next.js, but Spring reads it
# automatically at startup. Anything here can be overridden by an environment
# variable of the same name (with dots -> underscores, e.g. DB_URL).
# ============================================================================

# ---- Server ----
server.port=8080

# ---- App identity ----
spring.application.name=readly-backend

# ---- MySQL Database Connection ----
# 1) Create the database first:  CREATE DATABASE readly_db;
# 2) Update username/password below to match your local MySQL install.
spring.datasource.url=jdbc:mysql://localhost:3306/readly_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update -> Hibernate creates/updates tables automatically from your
# @Entity classes on startup. Great for development. Switch to "validate" in
# production and manage schema changes with a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---- JWT (JSON Web Token) settings ----
# jwt.secret must be at least 256 bits (32+ chars) for HS256 signing.
# CHANGE THIS before deploying anywhere real — treat it like a password.
jwt.secret=ReadlyBookstoreSuperSecretSigningKeyChangeThisInProduction2026
# Token lifetime in milliseconds (default: 24 hours)
jwt.expiration-ms=86400000

# ---- CORS: allow the Next.js frontend (running on localhost:3000) to call this API ----
app.cors.allowed-origins=http://localhost:3000

# ---- File uploads (used by /api/uploads for book cover images) ----
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Swagger / OpenAPI UI ----
# Visit http://localhost:8080/swagger-ui.html once the app is running
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Logging ----
logging.level.com.readly.backend=DEBUG
logging.level.org.springframework.security=INFO
